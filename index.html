<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #279EC5;
            --primary-dark: #1684AA;
            --primary-light: #E8F6FB;
            --text-dark: #1E293B;
            --text-gray: #64748B;
            --border: #E2E8F0;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #E8F6FB, #F8FCFE);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        button,
        input {
            font-family: inherit;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: var(--white);
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 10px 40px rgba(39, 158, 197, 0.12);
            border: 1px solid rgba(39, 158, 197, 0.08);
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            background: var(--primary-light);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            color: var(--primary);
            font-size: 38px;
            font-weight: bold;
            overflow: hidden;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }

        .header h1 {
            color: var(--text-dark);
            font-size: 25px;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-gray);
            font-size: 14px;
            line-height: 1.6;
        }

        .brand-line {
            width: 45px;
            height: 4px;
            background: var(--primary);
            border-radius: 10px;
            margin: 15px auto 0;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .input-wrapper input[type="text"] {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid var(--border);
            border-radius: 11px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            color: var(--text-dark);
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(39, 158, 197, 0.12);
        }

        /* Logo Upload */

        .upload-area {
            border: 2px dashed #B7DDEB;
            background: #F8FCFE;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .upload-icon {
            font-size: 30px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .upload-area p {
            font-size: 13px;
            color: var(--text-gray);
            line-height: 1.6;
        }

        .upload-area strong {
            color: var(--primary);
        }

        .upload-area input {
            display: none;
        }

        .logo-preview-container {
            display: none;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            padding: 12px;
            background: var(--primary-light);
            border-radius: 10px;
        }

        .logo-preview-container.show {
            display: flex;
        }

        .logo-preview {
            width: 65px;
            height: 65px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            padding: 5px;
            border: 1px solid var(--border);
        }

        .logo-info {
            flex: 1;
            min-width: 0;
        }

        .logo-info strong {
            display: block;
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 5px;
            word-break: break-all;
        }

        .logo-info span {
            font-size: 12px;
            color: var(--text-gray);
        }

        .remove-logo-btn {
            background: #FEE2E2;
            color: #DC2626;
            border: none;
            padding: 8px 10px;
            border-radius: 7px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Generate Button */

        .generate-btn {
            width: 100%;
            height: 52px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .generate-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(39, 158, 197, 0.2);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Messages */

        .error-message {
            color: #DC2626;
            font-size: 13px;
            margin-top: 12px;
            line-height: 1.5;
        }

        .success-message {
            color: var(--primary-dark);
            font-size: 13px;
            margin-top: 15px;
            font-weight: 600;
        }

        /* QR Result */

        .qr-result {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .qr-result h3 {
            font-size: 18px;
            color: var(--text-dark);
            margin-bottom: 18px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* QR Wrapper */

        .qr-wrapper {
            display: inline-block;
            background: white;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        #qrcode canvas {
            display: block;
            width: 100%;
            max-width: 300px;
            height: auto;
        }

        .generated-url {
            margin-top: 16px;
            color: var(--text-gray);
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
        }

        /* Buttons */

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-buttons button {
            flex: 1;
            height: 45px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .download-btn {
            background: var(--primary);
            color: white;
            border: none;
        }

        .download-btn:hover {
            background: var(--primary-dark);
        }

        .copy-btn {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 1px solid #D3EDF6;
        }

        .copy-btn:hover {
            background: #D7F0F8;
        }

        .hidden {
            display: none !important;
        }

        /* Footer */

        footer {
            text-align: center;
            color: var(--text-gray);
            font-size: 12px;
            margin-top: 22px;
        }

        footer span {
            color: var(--primary);
            font-weight: 700;
        }

        /* Mobile */

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <!-- Header -->
            <div class="header">

                <!-- <div class="logo-icon" id="headerLogoContainer">
                    <span>QR</span>
                </div> -->

                <h1>QR Generator</h1>

                <p>
                    Generate branded QR codes for your website
                </p>

                <div class="brand-line"></div>

            </div>

            <!-- Website URL -->
            <div class="form-group">

                <label for="urlInput">
                    Website URL
                </label>

                <div class="input-wrapper">

                    <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="url">

                </div>

            </div>

            <!-- Logo Upload -->
            <div class="form-group">

                <label>
                    Upload QR Logo (Optional)
                </label>

                <label class="upload-area" for="logoInput">

                    <input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp">

                    <!-- <div class="upload-icon">
                        ↑
                    </div> -->

                    <p>
                        <strong>Click to upload logo</strong>
                        <br>
                        PNG, JPG, JPEG, WEBP
                        <br>
                        Recommended: Square or transparent logo
                    </p>

                </label>

                <!-- Logo Preview -->
                <div class="logo-preview-container" id="logoPreviewContainer">

                    <img id="logoPreview" class="logo-preview" alt="Logo Preview">

                    <div class="logo-info">

                        <strong id="logoFileName">
                            Logo uploaded
                        </strong>

                        <span id="logoFileSize"></span>

                    </div>

                    <button type="button" class="remove-logo-btn" id="removeLogoBtn">
                        Remove
                    </button>

                </div>

            </div>

            <!-- Generate Button -->
            <button type="button" id="generateBtn" class="generate-btn">
                Generate QR Code
            </button>

            <!-- Error Message -->
            <p id="errorMessage" class="error-message" role="alert"></p>

            <!-- QR Result -->
            <div id="qrResult" class="qr-result hidden">

                <h3>Your QR Code</h3>

                <div class="qr-wrapper">

                    <div id="qrcode"></div>

                </div>

                <p id="generatedUrl" class="generated-url"></p>

                <!-- Action Buttons -->
                <div class="action-buttons">

                    <button type="button" id="downloadBtn" class="download-btn">
                        Download PNG
                    </button>

                    <button type="button" id="copyBtn" class="copy-btn">
                        Copy URL
                    </button>

                </div>

                <p id="successMessage" class="success-message" role="status"></p>

            </div>

        </div>

        <footer>
            Powered by <span>DEV</span> | QR Code Generator
        </footer>

    </div>

    <script>

        // =========================================
        // CONFIGURATION
        // =========================================

        const CONFIG = {
            primaryColor: "#000000",
            backgroundColor: "#FFFFFF",

            qrSize: 600,
            whitePadding: 40,

            logoWidth: 120,
            logoHeight: 100,
            logoPadding: 15,

            maxLogoSize: 5 * 1024 * 1024
        };

        // =========================================
        // DOM ELEMENTS
        // =========================================

        const urlInput = document.getElementById("urlInput");

        const logoInput = document.getElementById("logoInput");

        const generateBtn = document.getElementById("generateBtn");

        const downloadBtn = document.getElementById("downloadBtn");

        const copyBtn = document.getElementById("copyBtn");

        const removeLogoBtn = document.getElementById("removeLogoBtn");

        const headerLogoContainer = document.getElementById(
            "headerLogoContainer"
        );

        const logoPreview = document.getElementById("logoPreview");

        const logoPreviewContainer = document.getElementById(
            "logoPreviewContainer"
        );

        const logoFileName = document.getElementById("logoFileName");

        const logoFileSize = document.getElementById("logoFileSize");

        const qrContainer = document.getElementById("qrcode");

        const qrResult = document.getElementById("qrResult");

        const errorMessage = document.getElementById("errorMessage");

        const successMessage = document.getElementById("successMessage");

        const generatedUrl = document.getElementById("generatedUrl");

        // =========================================
        // VARIABLES
        // =========================================

        let currentURL = "";

        let uploadedLogo = null;

        let finalQRCodeCanvas = null;

        let logoObjectURL = null;

        // =========================================
        // LOGO UPLOAD
        // =========================================

        logoInput.addEventListener("change", function (event) {

            const file = event.target.files[0];

            if (!file) return;

            errorMessage.textContent = "";

            successMessage.textContent = "";

            // Validate image type
            const allowedTypes = [
                "image/png",
                "image/jpeg",
                "image/webp"
            ];

            if (!allowedTypes.includes(file.type)) {

                errorMessage.textContent =
                    "Please upload PNG, JPG or WEBP image.";

                logoInput.value = "";

                return;
            }

            // Validate file size
            if (file.size > CONFIG.maxLogoSize) {

                errorMessage.textContent =
                    "Logo size must be less than 5 MB.";

                logoInput.value = "";

                return;
            }

            // Remove previous object URL
            if (logoObjectURL) {

                URL.revokeObjectURL(logoObjectURL);

            }

            // Create object URL
            logoObjectURL = URL.createObjectURL(file);

            const image = new Image();

            image.onload = function () {

                uploadedLogo = image;

                // Show logo preview
                logoPreview.src = logoObjectURL;

                logoFileName.textContent = file.name;

                logoFileSize.textContent =
                    (file.size / 1024).toFixed(2) + " KB";

                logoPreviewContainer.classList.add("show");

                // Update Header Logo
                headerLogoContainer.innerHTML = "";

                const headerImage = document.createElement("img");

                headerImage.src = logoObjectURL;

                headerImage.alt = "Uploaded Logo";

                headerLogoContainer.appendChild(headerImage);

                // Reset previous QR
                qrResult.classList.add("hidden");

                finalQRCodeCanvas = null;

                successMessage.textContent =
                    "Logo uploaded successfully!";

            };

            image.onerror = function () {

                errorMessage.textContent =
                    "Unable to load image. Please try another file.";

                removeLogo();

            };

            image.src = logoObjectURL;

        });

        // =========================================
        // REMOVE LOGO
        // =========================================

        function removeLogo() {

            uploadedLogo = null;

            logoInput.value = "";

            logoPreview.src = "";

            logoPreviewContainer.classList.remove("show");

            headerLogoContainer.innerHTML = "<span>QR</span>";

            if (logoObjectURL) {

                URL.revokeObjectURL(logoObjectURL);

                logoObjectURL = null;

            }

            finalQRCodeCanvas = null;

            qrResult.classList.add("hidden");

            successMessage.textContent =
                "Logo removed. QR Code can be generated without a logo.";

        }

        removeLogoBtn.addEventListener("click", removeLogo);

        // =========================================
        // VALIDATE URL
        // =========================================

        function validateURL(value) {

            let url = value.trim();

            if (!url) {

                throw new Error("Please enter a website URL.");

            }

            // Add HTTPS automatically
            if (!/^https?:\/\//i.test(url)) {

                url = "https://" + url;

            }

            try {

                const parsedURL = new URL(url);

                if (
                    !["http:", "https:"].includes(parsedURL.protocol) ||
                    !parsedURL.hostname.includes(".")
                ) {

                    throw new Error("Invalid URL");

                }

                return parsedURL.href;

            } catch (error) {

                throw new Error("Please enter a valid website URL.");

            }

        }

        // =========================================
        // GENERATE QR CODE
        // =========================================

        function generateQRCode() {

            errorMessage.textContent = "";

            successMessage.textContent = "";

            const inputValue = urlInput.value.trim();

            // Validate URL
            try {

                currentURL = validateURL(inputValue);

            } catch (error) {

                errorMessage.textContent = error.message;

                urlInput.focus();

                return;

            }

            // Check QR Library
            if (typeof QRCode === "undefined") {

                errorMessage.textContent =
                    "QR Library failed to load. Check internet connection.";

                return;

            }

            generateBtn.disabled = true;

            generateBtn.textContent = "Generating...";

            try {

                // Temporary QR Container
                const tempContainer = document.createElement("div");

                // Generate Original QR
                new QRCode(tempContainer, {

                    text: currentURL,

                    width: CONFIG.qrSize,

                    height: CONFIG.qrSize,

                    colorDark: CONFIG.primaryColor,

                    colorLight: CONFIG.backgroundColor,

                    correctLevel: QRCode.CorrectLevel.H

                });

                const sourceCanvas = tempContainer.querySelector("canvas");

                if (!sourceCanvas) {

                    throw new Error("Unable to generate QR Code.");

                }

                // Create final branded QR
                createBrandedQRCode(sourceCanvas);

            } catch (error) {

                errorMessage.textContent = error.message;

            } finally {

                generateBtn.disabled = false;

                generateBtn.textContent = "Generate QR Code";

            }

        }

        // =========================================
        // CREATE BRANDED QR CODE
        // =========================================

        function createBrandedQRCode(sourceCanvas) {

            const padding = CONFIG.whitePadding;

            const size = CONFIG.qrSize;

            const finalSize = size + padding * 2;

            // Create final canvas
            const canvas = document.createElement("canvas");

            canvas.width = finalSize;

            canvas.height = finalSize;

            const ctx = canvas.getContext("2d");

            // White background
            ctx.fillStyle = "#FFFFFF";

            ctx.fillRect(
                0,
                0,
                finalSize,
                finalSize
            );

            // Draw QR Code
            ctx.drawImage(
                sourceCanvas,
                padding,
                padding,
                size,
                size
            );

            // =====================================
            // DRAW UPLOADED LOGO
            // =====================================


            if (uploadedLogo) {

                const maxWidth = CONFIG.logoWidth;
                const maxHeight = CONFIG.logoHeight;

                // Preserve original aspect ratio
                const scale = Math.min(
                    maxWidth / uploadedLogo.naturalWidth,
                    maxHeight / uploadedLogo.naturalHeight
                );

                const logoWidth = uploadedLogo.naturalWidth * scale;
                const logoHeight = uploadedLogo.naturalHeight * scale;

                const logoPadding = CONFIG.logoPadding;

                const boxWidth = logoWidth + logoPadding * 1.5;
                const boxHeight = logoHeight + logoPadding * 2;

                // Center position
                const centerX = finalSize / 2;
                const centerY = finalSize / 2;

                const logoX = centerX - logoWidth / 2;
                const logoY = centerY - logoHeight / 2;

                const boxX = centerX - boxWidth / 2;
                const boxY = centerY - boxHeight / 2;

                // High quality rendering
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";

                // White background behind logo
                ctx.fillStyle = "#FFFFFF";

                ctx.beginPath();

                ctx.roundRect(
                    boxX,
                    boxY,
                    boxWidth,
                    boxHeight,
                    12
                );

                ctx.fill();

                // Draw logo without distortion
                ctx.drawImage(
                    uploadedLogo,
                    logoX,
                    logoY,
                    logoWidth,
                    logoHeight
                );
            }

            // =====================================
            // DISPLAY FINAL QR
            // =====================================

            qrContainer.innerHTML = "";

            canvas.style.width = "100%";

            canvas.style.maxWidth = "300px";

            canvas.style.height = "auto";

            canvas.style.display = "block";

            qrContainer.appendChild(canvas);

            finalQRCodeCanvas = canvas;

            // Display URL
            generatedUrl.textContent = currentURL;

            // Show result
            qrResult.classList.remove("hidden");

            successMessage.textContent =
                "QR Code generated successfully!";

        }

        // =========================================
        // GENERATE BUTTON
        // =========================================

        generateBtn.addEventListener("click", function () {

            generateQRCode();

        });

        // =========================================
        // ENTER KEY
        // =========================================

        urlInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                generateQRCode();

            }

        });

        // =========================================
        // DOWNLOAD PNG
        // =========================================

        downloadBtn.addEventListener("click", function () {

            if (!finalQRCodeCanvas) {

                errorMessage.textContent =
                    "Please generate QR Code first.";

                return;

            }

            try {

                const link = document.createElement("a");

                link.download = "QR-Code.png";

                link.href = finalQRCodeCanvas.toDataURL("image/png");

                link.click();

                successMessage.textContent =
                    "QR Code downloaded successfully!";

            } catch (error) {

                errorMessage.textContent =
                    "Unable to download QR Code.";

            }

        });

        // =========================================
        // COPY URL
        // =========================================

        copyBtn.addEventListener("click", async function () {

            if (!currentURL) return;

            try {

                await navigator.clipboard.writeText(currentURL);

                successMessage.textContent =
                    "URL copied successfully!";

                copyBtn.textContent = "Copied!";

                setTimeout(function () {

                    copyBtn.textContent = "Copy URL";

                }, 2000);

            } catch (error) {

                errorMessage.textContent =
                    "Unable to copy URL. Use HTTPS or localhost.";

            }

        });

    </script>

</body>

</html>
